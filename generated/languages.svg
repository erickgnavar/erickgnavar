<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title">
  <title id="title">Language usage</title>
  <style>
    .background { fill: #ffffff; stroke: #d0d7de; }
    .title { fill: #24292f; font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #24292f; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .value { fill: #24292f; font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #57606a; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .grid { stroke: #d8dee4; stroke-width: 1; }
    .empty { fill: #ebedf0; }
    .level-1 { fill: #9be9a8; }
    .level-2 { fill: #40c463; }
    .level-3 { fill: #30a14e; }
    .level-4 { fill: #216e39; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; stroke: #30363d; }
      .title, .label, .value { fill: #e6edf3; }
      .muted { fill: #8b949e; }
      .grid { stroke: #30363d; }
      .empty { fill: #161b22; }
      .level-1 { fill: #0e4429; }
      .level-2 { fill: #006d32; }
      .level-3 { fill: #26a641; }
      .level-4 { fill: #39d353; }
    }
  </style>
  <rect class="background" x="0.5" y="0.5" width="799" height="359" rx="10" />
  <text class="title" x="28" y="38">Language usage</text>
  <circle cx="190" cy="190" r="92" fill="none" stroke="#3178c6" stroke-width="30" stroke-dasharray="338.09 239.97" stroke-dashoffset="-0.00" transform="rotate(-90 190 190)" />
  <circle cx="190" cy="190" r="92" fill="none" stroke="#a855f7" stroke-width="30" stroke-dasharray="67.56 510.49" stroke-dashoffset="-338.09" transform="rotate(-90 190 190)" />
  <circle cx="190" cy="190" r="92" fill="none" stroke="#22c55e" stroke-width="30" stroke-dasharray="60.65 517.41" stroke-dashoffset="-405.65" transform="rotate(-90 190 190)" />
  <circle cx="190" cy="190" r="92" fill="none" stroke="#f59e0b" stroke-width="30" stroke-dasharray="57.73 520.32" stroke-dashoffset="-466.29" transform="rotate(-90 190 190)" />
  <circle cx="190" cy="190" r="92" fill="none" stroke="#ef4444" stroke-width="30" stroke-dasharray="26.69 551.36" stroke-dashoffset="-524.03" transform="rotate(-90 190 190)" />
  <circle cx="190" cy="190" r="92" fill="none" stroke="#06b6d4" stroke-width="30" stroke-dasharray="7.48 570.57" stroke-dashoffset="-550.71" transform="rotate(-90 190 190)" />
  <circle cx="190" cy="190" r="92" fill="none" stroke="#ec4899" stroke-width="30" stroke-dasharray="3.99 574.06" stroke-dashoffset="-558.20" transform="rotate(-90 190 190)" />
  <circle cx="190" cy="190" r="92" fill="none" stroke="#64748b" stroke-width="30" stroke-dasharray="15.87 562.19" stroke-dashoffset="-562.19" transform="rotate(-90 190 190)" />
  <circle class="background" cx="190" cy="190" r="66" stroke="none" />
  <text class="value" x="190" y="186" text-anchor="middle">Languages</text>
  <text class="muted" x="190" y="207" text-anchor="middle">8 shown</text>
  <rect x="365" y="88" width="12" height="12" rx="2" fill="#3178c6" />
  <text class="label" x="387" y="100">JavaScript</text>
  <text class="muted" x="387" y="119">58.5%</text>
  <rect x="570" y="88" width="12" height="12" rx="2" fill="#a855f7" />
  <text class="label" x="592" y="100">CSS</text>
  <text class="muted" x="592" y="119">11.7%</text>
  <rect x="365" y="146" width="12" height="12" rx="2" fill="#22c55e" />
  <text class="label" x="387" y="158">Python</text>
  <text class="muted" x="387" y="177">10.5%</text>
  <rect x="570" y="146" width="12" height="12" rx="2" fill="#f59e0b" />
