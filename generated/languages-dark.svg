    .muted { fill: #8b949e; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .grid { stroke: #30363d; stroke-width: 1; }
    .empty { fill: #161b22; }
  </style>
  <rect class="background" x="0.5" y="0.5" width="799" height="359" rx="10" />
