<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title">
  <title id="title">Language usage trends</title>
  <style>
    .background { fill: #0d1117; stroke: #30363d; }
    .title { fill: #e6edf3; font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #e6edf3; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
