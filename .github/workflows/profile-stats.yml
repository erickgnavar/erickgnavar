name: Update profile README stats

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-readme-stats
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Update profile statistics
        uses: erickgnavar/github-profile-readme-stats@master
        with:
          github-token: ${{ secrets.METRICS_SECRET }}
